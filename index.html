<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4f3226" />
  <title>MurrHub — прототип</title>
  <link rel="icon" href="media/paw-icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="media/paw-icon.png" />
  <link rel="stylesheet" href="css/app.css" />
  <script src="js/chocolate.js"></script>
  <script>
    (function () {
      var n = localStorage.getItem("murrhub-chocolate");
      var theme = localStorage.getItem("murrhub-theme");
      var value = n == null || n === "" ? 78 : Number(n);
      if (!isFinite(value)) value = 78;
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
      MurrChocolate.apply(value, theme === "dark" ? "dark" : "light");
    })();
  </script>
</head>
<body>
  <div class="splash" id="splash" hidden>
    <button type="button" class="splash-paw" id="splash-paw" aria-label="Открыть">
      <img src="media/paw-icon.png" alt="" />
    </button>
  </div>
  <div class="studio">
    <header class="bar">
      <a class="brand" href="#/client/feed"><img class="mark" src="media/paw-icon.png" alt="" />Murr<em>Hub</em></a>
      <p class="bar-note">Прототип · Вильнюс · без сборки</p>
      <div class="bar-actions">
        <div class="switch" role="group" aria-label="Роль">
          <button type="button" id="role-client" data-role="client">Клиент</button>
          <button type="button" id="role-master" data-role="master">Мастер</button>
        </div>
        <label class="choc" for="chocolate">Шоколад
          <input id="chocolate" type="range" min="0" max="100" value="78" aria-label="Светлая тема: от песка к шоколаду" />
        </label>
        <button type="button" id="theme" class="ghost" aria-pressed="false">Тёмная</button>
        <button type="button" id="restart" class="ghost">Начать с начала</button>
        <a class="ghost" href="flows.html">Потоки</a>
        <button type="button" id="reset" class="ghost">Сбросить</button>
      </div>
    </header>
    <div class="stage">
      <aside class="aside left">
        <p class="eyebrow">Две роли, один профиль</p>
        <h2>Запись — первая работа. Лента — привычка.</h2>
        <p id="where" class="where"></p>
        <p class="fine">Имена и работы вымышленные. Салона нет: один человек — один профиль. Комиссия и оплата в приложении в эту версию не входят.</p>
      </aside>
      <div class="phone" id="phone">
        <div class="island" aria-hidden="true"></div>
        <div class="statusbar"><span>9:41</span><span class="sigs" aria-hidden="true"><i></i><i></i><b></b></span></div>
        <div class="screen" id="screen"></div>
        <nav class="tabbar" id="tabbar" aria-label="Разделы"></nav>
        <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
      </div>
      <aside class="aside right">
        <p class="eyebrow">Переходы</p>
        <nav class="jumps" id="jumps"></nav>
      </aside>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
