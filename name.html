<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#14110e" />
  <title>MurrHub — название</title>
  <link rel="icon" href="media/instagram.png" type="image/png" />
  <link rel="stylesheet" href="css/app.css" />
  <style>
    .namewin .mark:has(svg)::before { content: none; }
    .namewin .mark svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .namewin .mark svg path {
      fill: var(--ink);
      cursor: pointer;
      pointer-events: visibleFill;
    }
    .namewin .mark svg path[data-tone="accent"] { fill: var(--mark-accent, var(--rose)); }
    .namewin-color { display: flex; gap: 6px; align-items: center; }
    .namewin #mark-tone {
      flex: 1;
      width: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
      color: var(--ink);
      padding: 8px 10px;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      text-align: left;
    }
    .namewin #mark-accent {
      width: 44px;
      height: 36px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
      flex: none;
    }
  </style>
  <script src="js/chocolate.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/mark-parts.js"></script>
  <script src="js/namewin.js"></script>
  <script>MurrName.applyTheme();</script>
</head>
<body>
  <main class="namepage">
    <section class="namewin" id="namewin" aria-label="Название">
      <p class="namewin-kicker">Название</p>
      <div class="lockup-stage">
        <div class="lockup" id="lockup" data-layout="left">
          <span class="mark" data-logo="flower" aria-hidden="true"></span>
          <b class="lockup-name" id="lockup-name">Moob</b>
        </div>
      </div>
      <label class="namewin-field">Знак
        <select id="logo-pick">
          <option value="flower">Цветок</option>
          <option value="paw">Лапа</option>
          <option value="trio">Трое</option>
          <option value="burst">Всплеск</option>
          <option value="hand">Ладонь</option>
          <option value="spark">Искра</option>
          <option value="sun">Солнце</option>
          <option value="figure">Фигура</option>
          <option value="cross">Крест</option>
          <option value="tree">Дерево</option>
          <option value="pinwheel">Вертушка</option>
          <option value="bloom">Розетка</option>
          <option value="ampersand">Амперсанд</option>
          <option value="cat">Кот</option>
          <option value="arrow">Стрелка</option>
          <option value="spots">Пятна</option>
          <option value="knot">Узел</option>
          <option value="peaks">Пики</option>
          <option value="rings">Кольца</option>
        </select>
      </label>
      <label class="namewin-field">Цвет
        <span class="namewin-color">
          <button type="button" id="mark-tone" data-tone="ink">Текст</button>
          <input id="mark-accent" type="color" value="#e08955" aria-label="Акцент">
        </span>
      </label>
      <label class="namewin-field">Макет
        <select id="lockup-layout">
          <option value="left">Слева</option>
          <option value="above">Сверху</option>
          <option value="right">Справа</option>
          <option value="stack">Стопка</option>
          <option value="compact">Плотно</option>
          <option value="wide">Широко</option>
        </select>
      </label>
      <div class="name-cycle">
        <button type="button" id="name-prev">Назад</button>
        <label class="namewin-field">Список
          <select id="name-pick">
            <option value="">Своё</option>
          </select>
        </label>
        <button type="button" id="name-next">Дальше</button>
      </div>
      <label class="namewin-field">Своё имя
        <input id="name-custom" type="text" maxlength="24" autocomplete="off" spellcheck="false" value="Moob" />
      </label>
    </section>
  </main>
</body>
</html>
